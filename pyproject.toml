[project]
name = "myapp"
version = "0.1.0"
description = "Project mẫu được quản lý bằng uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "flask>=3.1.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

# --- Ruff: lint + format ---
[tool.ruff]
line-length = 88
target-version = "py312"          # khớp Python 3.12

[tool.ruff.lint]
# E/W: style  F: lỗi import/biến  I: sắp xếp import
# B: bugbear  UP: nâng cấp syntax  SIM: đơn giản hóa  C4: comprehension  RUF: rule riêng ruff
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]              # bỏ qua import chưa dùng trong test

[tool.ruff.format]
quote-style = "double"

# --- Mypy: kiểu tĩnh ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# pre-commit/CI chạy "uv run mypy" không đối số -> chỉ định rõ file cần kiểm tra.
# Chỉ strict-check source code chính (test nhiều mock/fixture khó chú thích kiểu).
files = ["main.py", "app", "web", "webapp.py"]

# --- Pytest + coverage ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=. --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
