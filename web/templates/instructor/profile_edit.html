{% extends "base.html" %}
{% block title %}Chỉnh sửa hồ sơ — Giảng viên{% endblock %}
{% block content %}
<h1>Chỉnh sửa hồ sơ</h1>

<form method="post" action="{{ url_for('instructor.profile_edit') }}" class="card form-card">
  <label>Họ tên
    <input type="text" name="full_name" value="{{ user.full_name or '' }}">
  </label>
  <label>Chuyên môn / Giới thiệu
    <textarea name="bio" rows="4">{{ user.bio or '' }}</textarea>
  </label>
  <div class="row-actions">
    <button type="submit" class="btn">Lưu thay đổi</button>
    <a class="btn ghost" href="{{ url_for('instructor.profile') }}">Huỷ</a>
  </div>
</form>
{% endblock %}
