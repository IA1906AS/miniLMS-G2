{% extends "base.html" %}
{% block title %}Đặt mật khẩu mới — miniLMS{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h1>Đặt mật khẩu mới</h1>

    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    {% if success %}<div class="flash success">{{ success }}</div>{% endif %}

    {% if valid and not success %}
      <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
        <label>Mật khẩu mới
          <input type="password" name="new_password" required minlength="8">
        </label>
        <label>Xác nhận mật khẩu mới
          <input type="password" name="confirm_password" required minlength="8">
        </label>
        <button type="submit" class="btn full">Đặt lại mật khẩu</button>
      </form>
    {% endif %}

    <p class="auth-links"><a href="{{ url_for('auth.login') }}">← Về trang đăng nhập</a></p>
  </div>
</section>
{% endblock %}
